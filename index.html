<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WargaQu" />

    <title>WargaQu 1.3.1</title>
    <meta name="description" content="Cerdas Kreatif Peduli" />
    <meta property="og:title" content="WargaQu 1.3.1" />
    <meta property="og:description" content="Cerdas Kreatif Peduli" />

    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="alternate icon" href="./favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased select-none font-sans overflow-x-hidden" style="background-color: #0f172a; color: #f8fafc; margin: 0;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; color: #f8fafc; font-family: sans-serif; gap: 12px;">
        <div style="width: 44px; height: 44px; border-radius: 50%; border: 3px solid #334155; border-top-color: #10b981; animation: spin 0.8s linear infinite;"></div>
        <div style="font-size: 14px; font-weight: 700; letter-spacing: 0.5px; color: #f8fafc;">Memuat WargaQu...</div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script>
      // Global error listener to prevent blank white screens
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.firstElementChild || root.innerHTML.indexOf('Memuat WargaQu') !== -1)) {
          root.innerHTML = '<div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0c0a09; color: #f5f5f4; font-family: sans-serif; padding: 24px; text-align: center;">' +
            '<div style="width: 48px; height: 48px; border-radius: 16px; background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.3); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; font-size: 24px;">⚠️</div>' +
            '<h2 style="font-size: 17px; font-weight: 700; color: #ffffff; margin: 0 0 8px 0;">Memuat WargaQu Terkendala</h2>' +
            '<p style="font-size: 12px; color: #a8a29e; max-width: 320px; margin: 0 0 20px 0; line-height: 1.5;">Gagal mengunduh berkas skrip web. Anda dapat memuat ulang atau mereset cache lokal aplikasi.</p>' +
            '<div style="display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 240px;">' +
              '<button onclick="window.location.reload();" style="padding: 10px 16px; background: #0d9488; color: white; border: none; border-radius: 12px; font-weight: 600; font-size: 13px; cursor: pointer;">Muat Ulang</button>' +
              '<button onclick="localStorage.clear(); sessionStorage.clear(); if(\'caches\' in window) { caches.keys().then(function(k){ k.forEach(function(c){ caches.delete(c); }); }); } window.location.reload();" style="padding: 10px 16px; background: #292524; color: #d6d3d1; border: 1px solid #44403c; border-radius: 12px; font-weight: 500; font-size: 12px; cursor: pointer;">Bersihkan Cache & Reset</button>' +
            '</div>' +
          '</div>';
        }
      });
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
